{% extends "base.html" %}
{% block title %}Configuracion{% endblock %}

{% block content %}
<div class="py-4">

    <h1 class="h3 mb-4">Configuración</h1>

    <form method="POST" action="{{ url_for('nfc.admin_settings') }}">
        <div class="card mb-4">
            <div class="card-header">Webapp del trabajador</div>
            <div class="card-body">

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" role="switch" id="nfc_only" name="nfc_only" value="1"
                           {% if nfc_only %}checked{% endif %} style="cursor:pointer">
                    <label class="form-check-label" for="nfc_only" style="cursor:pointer">
                        <strong>Solo NFC para iniciar/cerrar sesiones</strong>
                        <br><small class="text-body-secondary">Si esta activado, los trabajadores solo pueden iniciar y cerrar sesiones de limpieza y atención escaneando el tag NFC. Si esta desactivado, pueden también seleccionar desde la lista.</small>
                    </label>
                </div>

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" role="switch" id="allow_group_care" name="allow_group_care" value="1"
                           {% if allow_group_care %}checked{% endif %} style="cursor:pointer">
                    <label class="form-check-label" for="allow_group_care" style="cursor:pointer">
                        <strong>Permitir atenciones grupales</strong>
                        <br><small class="text-body-secondary">Si esta activado, los trabajadores pueden seleccionar varios residentes a la vez para iniciar una atención grupal. Si esta desactivado, solo se permite atención individual.</small>
                    </label>
                </div>

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" role="switch" id="single_session" name="single_session" value="1"
                           {% if single_session %}checked{% endif %} style="cursor:pointer">
                    <label class="form-check-label" for="single_session" style="cursor:pointer">
                        <strong>Limitar a una sola sesión activa</strong>
                        <br><small class="text-body-secondary">Si esta activado, los trabajadores no pueden iniciar una nueva limpieza o atención si ya tienen una sesión en curso. Deben finalizar la sesión activa antes de iniciar otra.</small>
                    </label>
                </div>

                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="allow_worker_incidents" name="allow_worker_incidents" value="1"
                           {% if allow_worker_incidents %}checked{% endif %} style="cursor:pointer">
                    <label class="form-check-label" for="allow_worker_incidents" style="cursor:pointer">
                        <strong>Permitir a los trabajadores reportar incidencias</strong>
                        <br><small class="text-body-secondary">Si esta activado, los trabajadores pueden reportar incidencias desde la app. Si esta desactivado, solo los administradores pueden crear incidencias.</small>
                    </label>
                </div>

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" role="switch" id="allow_worker_activities" name="allow_worker_activities" value="1"
                           {% if allow_worker_activities %}checked{% endif %} style="cursor:pointer">
                    <label class="form-check-label" for="allow_worker_activities" style="cursor:pointer">
                        <strong>Mostrar actividades en la webapp del trabajador</strong>
                        <br><small class="text-body-secondary">Si está activado, los trabajadores ven las actividades del día en la webapp y pueden confirmar la asistencia de los residentes.</small>
                    </label>
                </div>

                <hr class="my-3">

                <div class="mb-0">
                    <label for="session_max_minutes" class="form-label">
                        <strong>Tiempo máximo de sesión (minutos)</strong>
                        <br><small class="text-body-secondary">Si una sesión de limpieza o atención supera este tiempo sin cerrarse, el trabajador recibira un aviso visual en la app. Valor por defecto: 120 minutos (2 horas).</small>
                    </label>
                    <input type="number" class="form-control" id="session_max_minutes"
                           name="session_max_minutes" value="{{ session_max_minutes }}"
                           min="15" max="1440" style="max-width:120px">
                </div>

                <div class="mb-0 mt-3">
                    <label for="hidden_logout_minutes" class="form-label">
                        <strong>Cierre de sesión por inactividad (minutos)</strong>
                        <br><small class="text-body-secondary">Cuando el trabajador cambia de app o bloquea la pantalla, se cerrara su sesión tras este tiempo de inactividad. Valor 0 = nunca cerrar sesión automáticamente (se usara solo la expiracion del token). Valor por defecto: 30 minutos.</small>
                    </label>
                    <input type="number" class="form-control" id="hidden_logout_minutes"
                           name="hidden_logout_minutes" value="{{ hidden_logout_minutes }}"
                           min="0" max="1440" style="max-width:120px">
                </div>

            </div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar configuración</button>
    </form>
</div>
{% endblock %}
