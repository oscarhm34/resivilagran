{% extends "base.html" %}
{% block title %}Configuracion{% endblock %}

{% block content %}
<div class="py-4">

    <h1 class="h3 mb-4">Configuracion</h1>

    <form method="POST" action="{{ url_for('nfc.admin_settings') }}">
        <div class="card mb-4">
            <div class="card-header">Webapp del trabajador</div>
            <div class="card-body">

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" role="switch" id="nfc_only" name="nfc_only" value="1"
                           {% if nfc_only %}checked{% endif %} style="cursor:pointer">
                    <label class="form-check-label" for="nfc_only" style="cursor:pointer">
                        <strong>Solo NFC para iniciar/cerrar sesiones</strong>
                        <br><small class="text-body-secondary">Si esta activado, los trabajadores solo pueden iniciar y cerrar sesiones de limpieza y atencion escaneando el tag NFC. Si esta desactivado, pueden tambien seleccionar desde la lista.</small>
                    </label>
                </div>

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" role="switch" id="allow_group_care" name="allow_group_care" value="1"
                           {% if allow_group_care %}checked{% endif %} style="cursor:pointer">
                    <label class="form-check-label" for="allow_group_care" style="cursor:pointer">
                        <strong>Permitir atenciones grupales</strong>
                        <br><small class="text-body-secondary">Si esta activado, los trabajadores pueden seleccionar varios residentes a la vez para iniciar una atencion grupal. Si esta desactivado, solo se permite atencion individual.</small>
                    </label>
                </div>

                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="single_session" name="single_session" value="1"
                           {% if single_session %}checked{% endif %} style="cursor:pointer">
                    <label class="form-check-label" for="single_session" style="cursor:pointer">
                        <strong>Limitar a una sola sesion activa</strong>
                        <br><small class="text-body-secondary">Si esta activado, los trabajadores no pueden iniciar una nueva limpieza o atencion si ya tienen una sesion en curso. Deben finalizar la sesion activa antes de iniciar otra.</small>
                    </label>
                </div>

            </div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar configuracion</button>
    </form>
</div>
{% endblock %}
